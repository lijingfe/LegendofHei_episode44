<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a14">
  <title>球面波传播</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?v=source-times">
  <link rel="stylesheet" href="./timeline.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="masthead">
    <div class="title">
      <span class="wave-icon" aria-hidden="true"></span>
      <h1>球面波传播</h1>
    </div>
    <dl class="parameters" aria-label="模拟参数">
      <div><dt>波速</dt><dd><span id="wave-speed">10</span> <small>m/s</small></dd></div>
      <div><dt>发射间隔</dt><dd><span id="emission-period">10</span> <small>s</small></dd></div>
      <div><dt>可见半径</dt><dd><span id="max-radius">600</span> <small>m</small></dd></div>
    </dl>
  </header>

  <main class="stage" aria-label="球面波模拟">
    <canvas id="scene" aria-label="三维球面波和 z = 0 参考网格"></canvas>

    <div class="controls">
      <div id="timeline"></div>
      <div class="coordinates">
        <h2 id="coordinates-title">波源坐标 <span>(x, y, z) · m</span></h2>
        <ul id="source-coordinates" aria-labelledby="coordinates-title"></ul>
      </div>
    </div>

    <div class="scene-notes" aria-hidden="true">
      <span class="axis-label">Z ↑</span>
      <span class="mouse-hint">左键旋转 · 滚轮缩放 · 右键平移</span>
    </div>

    <aside class="section" aria-labelledby="section-title">
      <h2 id="section-title">平面视图 <span>· z = 0</span></h2>
      <ul id="section-legend" class="section-legend" role="list" aria-label="波源颜色图例"></ul>
      <canvas id="section" aria-label="各波源投影与 z = 0 平面的交圆，X 轴向右，Y 轴向上"></canvas>
      <div class="section-key">
        <span>跨度 <span id="section-span">1160</span> m</span>
        <span class="scale"><i id="scale-bar" aria-hidden="true"></i><span id="scale-label">100 m</span></span>
      </div>
    </aside>

    <p id="load-error" class="load-error" role="status" hidden></p>
    <noscript><p class="load-error">请启用 JavaScript 以运行模拟。</p></noscript>
  </main>

  <script type="module">
    import('./main.js?v=source-times').catch((error) => {
      console.error(error);
      const message = document.querySelector('#load-error');
      message.textContent = '无法加载模拟。请确认可以访问 Three.js CDN，且浏览器支持 WebGL 2。';
      message.hidden = false;
    });
  </script>
</body>
</html>
